name: CodeQL

# Matrix covers primary stacks (JS/TS, Python, Android). Optional examples/rust and
# examples/go are excluded — see modules/rust/MODULE.md and modules/go/MODULE.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  detect-optional:
    name: Detect optional stacks
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.stacks.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - id: stacks
        run: |
          if [ -f examples/android/gradlew ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
          - language: python
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4

  analyze-android:
    name: Analyze (Android)
    runs-on: ubuntu-latest
    needs: detect-optional
    if: needs.detect-optional.outputs.android == 'true'
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java (Android)
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Initialize CodeQL (Android)
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          paths: examples/android
      - name: Build Android (CodeQL traced)
        working-directory: examples/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: github/codeql-action/analyze@v4
